auth --passalgo=sha512 --useshadow
eula --agreed
text
firstboot --disable
keyboard --vckeymap=fr --xlayouts='fr'
lang en_US.UTF-8

network --bootproto=dhcp --device=link --activate
network --hostname=rocky9.localdomain

rootpw $y$j9T$/iNLfLo5yqY4CR6tpl/3c.$3t2JcpDhEi80B8ZFAxWl/guI8pzpnD0alCYUd.PquRD --iscrypted
selinux --enforcing
skipx
timezone Europe/Paris
user --groups=wheel --name=julien --password=$y$j9T$/iNLfLo5yqY4CR6tpl/3c.$3t2JcpDhEi80B8ZFAxWl/guI8pzpnD0alCYUd.PquRD --iscrypted --gecos="julien"

bootloader --location=mbr --append="crashkernel=auto"
zerombr
ignoredisk --only-use=vda
zerombr
clearpart --all --initlabel --disklabel=gpt
part biosboot --size=1 --fstype=biosboot
part /boot --label=boot --size=1024 --asprimary --fstype=xfs
part pv.01 --label=sys  --size=10240  --grow --asprimary
volgroup vg_sys pv.01
logvol swap --label=lv_swap --size=4096 --vgname=vg_sys --name=swap
logvol / --label=root --size=1024 --grow --vgname=vg_sys --name=lv_root --fstype=xfs

%addon com_redhat_kdump --disable
%end

reboot

%packages --ignoremissing
@^minimal-environment
qemu-guest-agent
cloud-init
vim
rsyslog
iproute2
net-tools
traceroute
curl
screen
less
iputils-ping
%end

%post --nochroot --logfile=/mnt/sysimage/root/ks-post.log

sed --follow-symlinks -i "s/ rhgb quiet//" /mnt/sysimage/etc/default/grub
sed --follow-symlinks -i "s/ rhgb quiet//" /mnt/sysimage/boot/grub2/grubenv

echo "julien ALL=(ALL) NOPASSWD: ALL" >> /mnt/sysimage/etc/sudoers.d/julien
%end
